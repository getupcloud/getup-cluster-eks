apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teleport-agent
  namespace: flux-system
spec:
  chart:
    spec:
      chart: teleport-kube-agent
      version: 18.11.7
      sourceRef:
        kind: HelmRepository
        name: teleport
  install:
    createNamespace: true
    disableWait: true
    remediation:
      retries: -1
  upgrade:
    disableWait: false
    remediation:
      retries: -1
  interval: 10m
  releaseName: teleport-agent
  storageNamespace: getup
  targetNamespace: getup
  values:
    proxyAddr: getup.teleport.sh:443
    roles: kube,app,discovery
    enterprise: true

    podSecurityPolicy:
      enabled: false
      
    kubernetesDiscovery:
    - types:
      - app
      namespaces:
      - monitoring
      labels:
        teleport.io/app: ""

    highAvailability:
      replicaCount: 2
      podDisruptionBudget:
        enabled: true
        minAvailable: 1

    updater:
      enabled: true
      releaseChannel: "stable/cloud"

## RBAC para executar scans de segurança - sem necessidade de permissões de escrita
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teleport-k8s-full-readonly
  annotations:
    owner: getupcloud
rules:
  # Concede leitura em TODOS os recursos (namespaced e cluster-scoped, incluindo Secrets e Nodes)
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Concede leitura em endpoints não-recursos (ex: /healthz, /version, /metrics)
  - nonResourceURLs: ["*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: teleport-k8s-full-readonly-binding
  annotations:
    owner: getupcloud
subjects:
  - kind: Group
    name: teleport-k8s-readonly # Mesmo grupo definido na Role do Teleport
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: teleport-k8s-full-readonly
  apiGroup: rbac.authorization.k8s.io
